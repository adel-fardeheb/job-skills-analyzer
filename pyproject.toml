[project]
name = "job-skills-analyzer"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "psycopg[binary]>=3.3.8",
    "python-dotenv>=1.2.4",
    "sqlalchemy>=2.1.8",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]